name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Verify tag and release notes
        shell: bash
        run: |
          package_version="$(uv run --frozen python -c 'from mcp_usc import __version__; print(__version__)')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Run quality gates
        run: |
          uv run --frozen ruff check .
          uv run --frozen pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          uv venv .release-check --python 3.13
          uv pip install --python .release-check/bin/python dist/*.whl
          .release-check/bin/python -c "from mcp_usc import __version__; assert __version__ == '${GITHUB_REF_NAME#v}'"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "mcp-usc ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS
