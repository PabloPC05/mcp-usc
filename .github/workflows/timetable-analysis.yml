name: USC Friday Labs Analysis

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/analyse_friday_labs.py'
      - '.github/workflows/timetable-analysis.yml'

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: uv sync --frozen --extra dev
      - name: Query USC through MCP and solve laboratory groups
        run: uv run --frozen python .github/scripts/analyse_friday_labs.py
      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usc-friday-labs-analysis
          path: |
            usc-friday-labs-analysis.json
            usc-friday-labs-summary.json
          if-no-files-found: warn
