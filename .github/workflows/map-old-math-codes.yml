name: Map Old Math Codes

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/map_old_math_codes.py'
      - '.github/workflows/map-old-math-codes.yml'

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python .github/scripts/map_old_math_codes.py
