name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Test
        run: uv run --frozen pytest

      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv build

  latest-dependencies:
    # `uv tool install` ignores uv.lock and resolves the newest allowed versions, which is
    # what users get. soupsieve 3+ silently broke every USC parser this way.
    name: Latest allowed dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Install without the lockfile
        run: |
          uv venv .latest
          VIRTUAL_ENV=.latest uv pip install -e ".[dev]"

      - name: Test
        run: .latest/bin/python -m pytest

  container:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t mcp-usc:ci .

      - name: Smoke test the HTTP server
        run: |
          token="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker run -d --name mcp-usc -p 127.0.0.1:8000:8000 -e MCP_AUTH_TOKEN="$token" mcp-usc:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"mcp_ready":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = 401
          curl -fsS -X POST http://127.0.0.1:8000/mcp \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q list_pending_work

      - name: Show container logs
        if: always()
        run: docker logs mcp-usc || true

